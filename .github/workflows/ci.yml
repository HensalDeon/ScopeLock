name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only: the build must not need real secrets, and tests use
      # an in-memory MongoDB. Never put production values here.
      APP_URL: http://localhost:3000
      MONGODB_URI: mongodb://127.0.0.1:27017
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-anywhere-000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npm run check
      - run: npm run test:int
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
